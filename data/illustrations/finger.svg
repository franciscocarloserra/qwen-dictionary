<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Main finger outline -->
  <defs>
    <clipPath id="finger">
      <rect x="10" y="10" width="80" height="60" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <!-- Main finger shape -->
  <path d="M10 10 L70 10 L70 60 L10 60 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Shadow (left side) -->
  <rect x="5" y="25" width="60" height="20" fill="#e8dfcc" stroke="none"/>
  <!-- Shadow (right side) -->
  <rect x="75" y="25" width="60" height="20" fill="#e8dfcc" stroke="none"/>
  <!-- Hatching texture -->
  <g fill="none">
    <line x1="10" y1="10" x2="10" y2="60" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="50" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="40" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="30" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="20" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="20" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="30" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="40" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="10" x2="10" y2="50" stroke="#e8dfcc" stroke-width="2" opacity="0.3"/>
  </g>
</g></svg>