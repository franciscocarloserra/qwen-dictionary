<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background texture (parallel hatching) -->
  <defs>
    <pattern id="texture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8dfcc" stroke-width="1" />
      <path d="M 20 0 L 20 20 L 0 20 L 0 0" fill="none" stroke="#e8dfcc" stroke-width="1" />
    </pattern>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Main rectangular corner block -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Shadow block below the corner -->
  <rect x="15" y="45" width="70" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Shadow block to the right of the corner -->
  <rect x="55" y="25" width="20" height="70" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Shadow block to the left of the corner -->
  <rect x="5" y="50" width="20" height="70" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Top-left corner detail -->
  <rect x="15" y="15" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="15" y="15" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Top-right corner detail -->
  <rect x="85" y="15" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="85" y="15" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Bottom-left corner detail -->
  <rect x="15" y="80" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="15" y="80" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Bottom-right corner detail -->
  <rect x="85" y="80" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="85" y="80" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Texture lines inside the main corner -->
  <polygon points="20,20 50,20 50,50 20,50" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <polygon points="20,20 50,20 50,80 20,80" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <polygon points="20,50 50,50 50,80 20,80" fill="none" stroke="#e8dfcc" stroke-width="1" />
</g></svg>