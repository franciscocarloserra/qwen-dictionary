<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f" />

  <!-- Woodcut style: flat lines, minimal shading -->
  <!-- Shadow area -->
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" />
  <rect x="30" y="40" width="40" height="40" fill="#e8dfcc" opacity="0.6" />
  <rect x="20" y="50" width="60" height="10" fill="#e8dfcc" />
  <rect x="20" y="60" width="10" height="60" fill="#e8dfcc" opacity="0.6" />

  <!-- Main silver object -->
  <!-- Main body -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Handle -->
  <line x1="40" y1="20" x2="40" y2="50" stroke="#e8dfcc" stroke-width="2" />

  <!-- Neck -->
  <line x1="40" y1="50" x2="50" y2="50" stroke="#e8dfcc" stroke-width="2" />

  <!-- Collar/Shoulders -->
  <rect x="20" y="25" width="20" height="25" fill="#e8dfcc" opacity="0.5" />
  <rect x="35" y="25" width="20" height="25" fill="#e8dfcc" opacity="0.5" />

  <!-- Waist -->
  <rect x="30" y="40" width="40" height="10" fill="#e8dfcc" opacity="0.5" />

  <!-- Collar -->
  <rect x="40" y="50" width="10" height="20" fill="#e8dfcc" opacity="0.5" />

  <!-- Chest -->
  <rect x="45" y="30" width="25" height="25" fill="#e8dfcc" opacity="0.5" />

  <!-- Arms -->
  <rect x="20" y="45" width="20" height="20" fill="#e8dfcc" opacity="0.5" />
  <rect x="50" y="45" width="20" height="20" fill="#e8dfcc" opacity="0.5" />

  <!-- Hands -->
  <rect x="20" y="60" width="10" height="10" fill="#e8dfcc" opacity="0.5" />
  <rect x="50" y="60" width="10" height="10" fill="#e8dfcc" opacity="0.5" />

  <!-- Buttons/Flap -->
  <rect x="20" y="50" width="10" height="10" fill="#e8dfcc" opacity="0.5" />
  <rect x="50" y="50" width="10" height="10" fill="#e8dfcc" opacity="0.5" />

  <!-- Texture lines -->
  <polyline points="30,20 35,20 40,20 45,20 50,20 55,20 60,20 65,20 70,20 75,20 80,20 85,20 90,20 95,20 100,20" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8" />
  <polyline points="30,40 35,40 40,40 45,40 50,40 55,40 60,40 65,40 70,40 75,40 80,40 85,40 90,40 95,40 100,40" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8" />
</g></svg>