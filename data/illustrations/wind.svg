<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="none"/>

  <!-- Main Wind Shape -->
  <!-- Roughly a stylized, elongated line with curves -->
  <path d="M 20 10 L 50 15 L 70 10 L 85 15 L 80 25 L 60 30 L 40 35 L 20 30 L 15 25 L 10 20 L 5 22 L 3 18 L 1 12 L 5 10 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow Block 1 -->
  <rect x="35" y="35" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow Block 2 -->
  <rect x="55" y="55" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow Block 3 -->
  <rect x="75" y="35" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Texture Hatching -->
  <pattern id="hatch" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#e8dfcc" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#e8dfcc" stroke-width="2"/>
  </pattern>
  <rect x="0" y="0" width="100" height="100" fill="#e8dfcc"/>

  <!-- Additional shading for depth -->
  <rect x="25" y="30" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="45" y="50" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="65" y="30" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="85" y="50" width="20" height="10" fill="#e8dfcc" stroke="none"/>
</g></svg>