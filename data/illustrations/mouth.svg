<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f" />

  <!-- Mouth shape -->
  <polygon points="50,10 65,20 65,35 50,40 45,35 45,20 50,10" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Upper lip outline -->
  <polygon points="50,10 65,20 65,35 50,40 45,35" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Lower lip outline -->
  <polygon points="50,10 65,20 65,35 50,40 45,35" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Chin area with shadow -->
  <rect x="45" y="35" width="10" height="5" fill="#e8dfcc" stroke="none" />

  <!-- Shadow block (shadow) -->
  <rect x="45" y="40" width="10" height="5" fill="#e8dfcc" stroke="none" />

  <!-- Texture hatching (parallel lines) -->
  <g stroke="#e8dfcc" stroke-width="1" fill="none">
    <line x1="50" y1="35" x2="50" y2="40" />
    <line x1="50" y1="35" x2="50" y2="40" />
    <line x1="50" y1="35" x2="50" y2="40" />
    <line x1="50" y1="35" x2="50" y2="40" />
  </g>
</g></svg>