<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" />

  <!-- Main ring -->
  <!-- Outer ring -->
  <ellipse cx="50" cy="50" rx="45" ry="45" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <!-- Inner ring (darker) -->
  <ellipse cx="50" cy="50" rx="30" ry="30" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <!-- Center point -->
  <circle cx="50" cy="50" r="2" fill="#e8dfcc" />

  <!-- Shadow 1 (right side) -->
  <rect x="45" y="45" width="5" height="5" fill="#e8dfcc" />
  <rect x="47" y="45" width="5" height="5" fill="#e8dfcc" />
  <rect x="49" y="45" width="5" height="5" fill="#e8dfcc" />

  <!-- Shadow 2 (left side) -->
  <rect x="35" y="45" width="5" height="5" fill="#e8dfcc" />
  <rect x="37" y="45" width="5" height="5" fill="#e8dfcc" />
  <rect x="39" y="45" width="5" height="5" fill="#e8dfcc" />

  <!-- Shadow 3 (bottom) -->
  <rect x="45" y="55" width="5" height="5" fill="#e8dfcc" />
  <rect x="47" y="57" width="5" height="5" fill="#e8dfcc" />
  <rect x="49" y="55" width="5" height="5" fill="#e8dfcc" />

  <!-- Shadow 4 (top) -->
  <rect x="35" y="55" width="5" height="5" fill="#e8dfcc" />
  <rect x="37" y="57" width="5" height="5" fill="#e8dfcc" />
  <rect x="39" y="55" width="5" height="5" fill="#e8dfcc" />

  <!-- Texture: parallel hatching (lighter) -->
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#16130f" />
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#16130f" />
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#16130f" />

  <!-- Texture: parallel hatching (darker) -->
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#c9a45c" />
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#c9a45c" />
  <polygon points="50,50 52,48 54,50 52,52 50,54" fill="#c9a45c" />
</g></svg>