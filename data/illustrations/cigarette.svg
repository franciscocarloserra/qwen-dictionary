<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main body of the cigarette -->
  <polyline points="40,80 50,60 60,80 80,60 90,80 100,60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left side of the cigarette -->
  <rect x="40" y="40" width="20" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Right side of the cigarette -->
  <rect x="70" y="40" width="20" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Neck -->
  <line x1="50" y1="60" x2="50" y2="80" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Base -->
  <rect x="40" y="80" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Wick -->
  <line x1="60" y1="95" x2="80" y2="95" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Burnt tip -->
  <circle cx="80" cy="90" r="2" fill="#e8dfcc"/>
  
  <!-- Burnt tip (second) -->
  <circle cx="60" cy="90" r="2" fill="#e8dfcc"/>
</g></svg>