<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f" stroke="#c9a45c" stroke-width="1"/>
  
  <!-- Wood grain texture (horizontal lines) -->
  <polyline points="0 90 20 90 40 90 60 90 80 90 100 90 120 90 140 90 160 90 180 90 200 90 220 90 240 90 260 90 280 90 300 90 320 90 340 90 360 90 380 90 400 90 420 90 440 90 460 90 480 90 500 90 520 90 540 90 560 90 580 90 600 90 620 90 640 90 660 90 680 90 700 90 720 90 740 90 760 90 780 90 800 90 820 90 840 90 860 90 880 90 900 90 920 90 940 90 960 90 980 90 1000 90" fill="#16130f" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Main wooden body -->
  <rect x="20" y="30" width="60" height="80" fill="#c9a45c" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Top part -->
  <rect x="20" y="10" width="60" height="25" fill="#c9a45c"/>
  <rect x="20" y="15" width="40" height="10" fill="#e8dfcc"/>
  
  <!-- Side panels -->
  <rect x="20" y="25" width="60" height="30" fill="#c9a45c" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="20" y="35" width="60" height="25" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Bottom part -->
  <rect x="20" y="60" width="60" height="20" fill="#c9a45c" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="20" y="65" width="40" height="10" fill="#e8dfcc"/>
  
  <!-- Cross-hatch pattern on the body -->
  <polygon points="50 50 70 40 80 60 90 50 70 60 90 50 70 60" fill="#16130f" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 1 (left side) -->
  <rect x="20" y="35" width="30" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 2 (right side) -->
  <rect x="80" y="35" width="30" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 3 (bottom) -->
  <rect x="20" y="65" width="60" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 4 (top left) -->
  <rect x="20" y="15" width="30" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 5 (top right) -->
  <rect x="80" y="15" width="30" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>