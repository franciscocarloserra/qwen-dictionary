<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut-hatch" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 80 0 L 80 40 L 20 40 Z" fill="none"/>
      <path d="M 20 0 L 80 0 L 80 40 L 20 40 Z" fill="none"/>
    </pattern>
    <linearGradient id="shadow-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8dfcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dfcc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Main body with woodcut texture -->
  <rect x="20" y="20" width="60" height="60" rx="10" ry="10" fill="none" stroke="#e8dfcc" stroke-width="3" filter="url(#shadow-filter)" />
  
  <!-- Left side (book spine) -->
  <path d="M 20 20 L 10 10 L 20 10 Z" fill="#e8dfcc" />
  <rect x="10" y="10" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Right side (book spine) -->
  <path d="M 80 20 L 90 10 L 80 10 Z" fill="#e8dfcc" />
  <rect x="90" y="10" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Page cover -->
  <path d="M 20 20 L 80 20 L 80 80 L 20 80 Z" fill="#e8dfcc" />
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" />
  
  <!-- Inner pages -->
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" />
  
  <!-- Blank pages -->
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" />
  <rect x="80" y="20" width="60" height="60" fill="#e8dfcc" />
  
  <!-- Bottom flap -->
  <path d="M 20 20 L 10 10 L 80 10 L 80 10 L 80 10 L 20 10 Z" fill="#e8dfcc" />
  <rect x="20" y="10" width="60" height="60" fill="#e8dfcc" />
  
  <!-- Top flap -->
  <path d="M 20 20 L 10 10 L 80 10 L 80 10 L 80 10 L 20 10 Z" fill="#e8dfcc" />
  <rect x="20" y="10" width="60" height="60" fill="#e8dfcc" />
  
  <!-- Shadow blocks -->
  <rect x="30" y="30" width="20" height="20" fill="#e8dfcc" />
  <rect x="70" y="30" width="20" height="20" fill="#e8dfcc" />
  <rect x="30" y="70" width="20" height="20" fill="#e8dfcc" />
  <rect x="70" y="70" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Hatching lines -->
  <path d="M 15 5 L 15 25 M 35 5 L 35 25 M 55 5 L 55 25" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.7" />
  <path d="M 15 5 L 15 25 M 35 5 L 35 25 M 55 5 L 55 25" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.7" />
</g></svg>