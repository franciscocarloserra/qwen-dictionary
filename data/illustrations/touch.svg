  <!-- Texture: short parallel hatching -->
  <path d="M 10 10 L 10 15 L 10 20 L 10 25 L 10 30 L 10 35 L 10 40 L 10 45 L 10 50 L 10 55 L 10 60 L 10 65 L 10 70 L 10 75 L 10 80 L 10 85 L 10 90 L 10 95 L 10 100 L 10 95 L 10 90 L 10 85 L 10 80 L 10 75 L 10 70 L 10 65 L 10 60 L 10 55 L 10 50 L 10 45 L 10 40 L 10 35 L 10 30 L 10 25 L 10 20 L 10 15 Z" fill="none" opacity="0.2"/>

