  <polygon points="30,10 50,20 40,30 30,40 20,30 30,20 40,10 50,20 40,30 30,40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <polygon points="30,10 50,20 40,30 30,40 20,30 30,20 40,10 50,20 40,30 30,40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <polygon points="30,10 50,20 40,30 30,40 20,30 30,20 40,10 50,20 40,30 30,40" fill="none" stroke="#e8dfcc" stroke-width="2"/>

