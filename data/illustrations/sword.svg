<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="5" y="5" width="90" height="90" fill="#16130f" stroke="none"/>

  <!-- Main body (rect) -->
  <rect x="10" y="15" width="80" height="70" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Left arm -->
  <rect x="10" y="20" width="30" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Right arm -->
  <rect x="70" y="20" width="30" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shoulder/chest area -->
  <rect x="10" y="35" width="80" height="15" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Sword blade (polygon) -->
  <polygon points="50,35 50,70 40,80 40,55" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Hatching texture (short parallel lines) -->
  <path d="M 50 35 L 50 55 L 55 55 L 55 70 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.6"/>
  <path d="M 50 35 L 50 55 L 45 55 L 45 70 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.6"/>

  <!-- Shadow (solid black block) -->
  <rect x="35" y="60" width="30" height="15" fill="#e8dfcc" opacity="0.8"/>

  <!-- Shadow (solid black block) -->
  <rect x="45" y="60" width="30" height="15" fill="#e8dfcc" opacity="0.8"/>

  <!-- Shadow (solid black block) -->
  <rect x="55" y="60" width="30" height="15" fill="#e8dfcc" opacity="0.8"/>

  <!-- Detail: blade edge (short parallel lines) -->
  <path d="M 45 55 L 55 55 L 55 70 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8"/>
  <path d="M 45 55 L 55 55 L 55 70 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8"/>
</g></svg>