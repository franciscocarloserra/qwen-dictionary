<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="10" y="10" width="80" height="80" fill="#16130f" />

  <!-- Main cream shape -->
  <rect x="20" y="20" width="60" height="60" fill="#16130f" stroke="#e8dfcc" stroke-width="2" />
  <rect x="30" y="30" width="40" height="40" fill="#16130f" stroke="#e8dfcc" stroke-width="2" />
  <rect x="40" y="20" width="40" height="40" fill="#16130f" stroke="#e8dfcc" stroke-width="2" />
  <rect x="50" y="30" width="40" height="40" fill="#16130f" stroke="#e8dfcc" stroke-width="2" />
  <rect x="60" y="20" width="40" height="40" fill="#16130f" stroke="#e8dfcc" stroke-width="2" />

  <!-- Shadow -->
  <rect x="30" y="60" width="40" height="40" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1" />

  <!-- Hatching texture -->
  <path d="M 10 40 L 10 50 M 20 40 L 20 50 M 30 40 L 30 50 M 40 40 L 40 50 M 50 40 L 50 50" fill="#16130f" stroke="#e8dfcc" stroke-width="1" />
  <path d="M 10 50 L 10 60 M 20 50 L 20 60 M 30 50 L 30 60 M 40 50 L 40 60 M 50 50 L 50 60" fill="#16130f" stroke="#e8dfcc" stroke-width="1" />

  <!-- Inner cream detail -->
  <rect x="25" y="45" width="25" height="25" fill="#16130f" stroke="#e8dfcc" stroke-width="1" />
  <rect x="25" y="65" width="25" height="25" fill="#16130f" stroke="#e8dfcc" stroke-width="1" />
</g></svg>