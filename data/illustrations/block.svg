<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Main block with woodcut style shadows and texture -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Top shadow -->
  <rect x="10" y="30" width="60" height="20" fill="#e8dfcc" opacity="0.8" />
  <rect x="10" y="50" width="60" height="20" fill="#e8dfcc" opacity="0.8" />
  
  <!-- Bottom shadow -->
  <rect x="10" y="70" width="60" height="20" fill="#e8dfcc" opacity="0.8" />
  
  <!-- Left shadow -->
  <rect x="0" y="10" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  <rect x="0" y="50" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  <rect x="0" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  
  <!-- Right shadow -->
  <rect x="80" y="10" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  <rect x="80" y="50" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  <rect x="80" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.8" />
  
  <!-- Top hatching -->
  <polygon points="10,30 20,35 30,35 30,45 20,50 10,50" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Bottom hatching -->
  <polygon points="10,70 20,75 30,75 30,85 20,90 10,90" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Left hatching -->
  <polygon points="0,10 10,15 20,15 20,25 10,30" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Right hatching -->
  <polygon points="80,10 70,15 60,15 60,25 80,30" fill="none" stroke="#e8dfcc" stroke-width="1" />
</g></svg>