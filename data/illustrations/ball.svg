<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Main Ball Body -->
  <polygon points="50,10 60,30 50,50 40,30 50,10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow Top -->
  <polygon points="40,15 55,35 60,55 50,35 40,15" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow Side -->
  <polygon points="30,25 55,45 60,65 50,45 30,25" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow Bottom -->
  <polygon points="40,55 55,75 60,95 50,75 40,55" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Texture Hatching -->
  <path d="M 20 40 L 40 40 L 60 40" stroke="#e8dfcc" stroke-width="1" fill="none" />
  <path d="M 20 50 L 40 50 L 60 50" stroke="#e8dfcc" stroke-width="1" fill="none" />
  <path d="M 20 60 L 40 60 L 60 60" stroke="#e8dfcc" stroke-width="1" fill="none" />
  <path d="M 20 70 L 40 70 L 60 70" stroke="#e8dfcc" stroke-width="1" fill="none" />
  
  <!-- Inner detail (part of the ball) -->
  <path d="M 30,30 L 40,30 L 50,30 L 60,30" stroke="#e8dfcc" stroke-width="1" fill="none" />
</g></svg>