<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><g fill="#e8dfcc">
  <defs>
    <pattern id="heat-pattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Main heat shape -->
  <polygon id="heat" points="50,30 50,70 25,30 75,30 75,70 50,70 25,70 25,30 50,30" fill="none" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Shadow -->
  <rect id="shadow" x="35" y="10" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching texture -->
  <path id="hatch" d="M 25,30 L 25,70 M 75,30 L 75,70 M 50,30 L 50,70 M 25,70 L 25,30 M 75,30 L 75,70" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round"/>
</g></svg>