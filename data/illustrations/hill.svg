<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background texture -->
  <polyline points="0,100 30,90 60,70 90,50 120,30 150,10 180,20 210,40 240,60 270,80 300,100" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main shape: hill -->
  <!-- Top plateau -->
  <rect x="10" y="30" width="80" height="30" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Left slope -->
  <polyline points="10,30 15,40 20,50 25,60 30,70 35,80 40,90" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Right slope -->
  <polyline points="50,30 55,40 60,50 65,60 70,70 75,80 80,90" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Bottom base -->
  <rect x="10" y="70" width="80" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow on left slope -->
  <rect x="10" y="60" width="60" height="10" fill="#e8dfcc" opacity="0.6"/>
  
  <!-- Shadow on right slope -->
  <rect x="50" y="60" width="60" height="10" fill="#e8dfcc" opacity="0.6"/>
  
  <!-- Texture lines -->
  <line x1="0" y1="100" x2="10" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="30" y1="90" x2="60" y2="70" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="90" y1="50" x2="120" y2="30" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="150" y1="10" x2="180" y2="20" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="210" y1="40" x2="240" y2="60" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="270" y1="80" x2="300" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Texture lines (shorter) -->
  <line x1="0" y1="100" x2="10" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="30" y1="90" x2="60" y2="70" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="90" y1="50" x2="120" y2="30" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="150" y1="10" x2="180" y2="20" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="210" y1="40" x2="240" y2="60" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>