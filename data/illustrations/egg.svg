  <!-- Texture hatching -->
  <path d="M 5 50 L 10 40 L 15 50 L 20 40 L 25 50 L 30 40 L 35 50 L 40 40 L 45 50 L 50 40 L 55 50 L 60 40 L 65 50 L 70 40 L 75 50 L 80 40 L 85 50 L 90 40 L 95 50 L 100 40 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>
</g></svg>