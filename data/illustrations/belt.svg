<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" />

  <!-- Main Belt Shape -->
  <!-- Top section -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="#e8dfcc" stroke-width="2" />
  <line x1="30" y1="40" x2="30" y2="50" stroke="#e8dfcc" stroke-width="2" />
  <line x1="70" y1="40" x2="70" y2="50" stroke="#e8dfcc" stroke-width="2" />

  <!-- Middle section -->
  <line x1="30" y1="70" x2="70" y2="70" stroke="#e8dfcc" stroke-width="2" />
  <line x1="30" y1="70" x2="30" y2="80" stroke="#e8dfcc" stroke-width="2" />
  <line x1="70" y1="70" x2="70" y2="80" stroke="#e8dfcc" stroke-width="2" />

  <!-- Bottom section -->
  <line x1="30" y1="100" x2="70" y2="100" stroke="#e8dfcc" stroke-width="2" />
  <line x1="30" y1="100" x2="30" y2="90" stroke="#e8dfcc" stroke-width="2" />
  <line x1="70" y1="100" x2="70" y2="90" stroke="#e8dfcc" stroke-width="2" />

  <!-- Shadows -->
  <!-- Shadow 1 (top left) -->
  <rect x="10" y="30" width="60" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="20" y="35" width="20" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 2 (top right) -->
  <rect x="70" y="30" width="60" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="80" y="35" width="20" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 3 (bottom left) -->
  <rect x="10" y="80" width="60" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="20" y="85" width="20" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 4 (bottom right) -->
  <rect x="70" y="80" width="60" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="80" y="85" width="20" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Texture Hatching -->
  <path d="M 0 0 L 10 0 M 10 0 L 20 0 M 0 0 L 10 0 M 10 0 L 20 0" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.5" />
</g></svg>