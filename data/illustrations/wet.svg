<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" />
  
  <!-- Main form (etched wood) -->
  <rect x="50" y="30" width="50" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="50" y="30" width="50" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="50" y="30" width="50" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow block 1 -->
  <rect x="20" y="50" width="60" height="20" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Shadow block 2 -->
  <rect x="45" y="40" width="30" height="30" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Shadow block 3 -->
  <rect x="60" y="20" width="30" height="30" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Hatching lines (parallel) -->
  <g stroke="#e8dfcc" stroke-width="1" fill="none">
    <line x1="45" y1="30" x2="45" y2="50" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="50" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="70" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="70" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="90" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="90" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="110" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="110" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="130" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="130" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="150" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="150" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="170" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="170" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="190" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="190" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="210" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="210" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="45" y2="230" stroke-dasharray="10,10" />
    <line x1="45" y1="30" x2="70" y2="230" stroke-dasharray="10,10" />
  </g>
</g></svg>