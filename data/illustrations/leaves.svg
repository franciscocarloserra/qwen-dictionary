<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatching" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Main leaves shape -->
  <g transform="translate(25,25)">
    <!-- Outer border -->
    <rect x="0" y="0" width="20" height="20" rx="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
    <!-- Inner core -->
    <rect x="5" y="5" width="10" height="10" rx="3" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Leaf body -->
    <ellipse cx="10" cy="10" rx="8" ry="8" fill="none" stroke="#e8dfcc" stroke-width="2"/>
    <!-- Leaf tip -->
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
    <!-- Shadow -->
    <rect x="5" y="5" width="10" height="10" rx="4" fill="none" stroke="#e8dfcc" stroke-width="3"/>
    <!-- Hatching -->
    <path d="M 5 5 L 15 5 L 15 15 L 5 15 L 5 5" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  </g>
</g></svg>