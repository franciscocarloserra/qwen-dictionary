  <rect x="60" y="80" width="20" height="20" fill="#e8dfcc" opacity="0.2"/>
  
  <!-- Shadow Block 4 -->
  <rect x="70" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
  <rect x="70" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.4"/>
  <rect x="70" y="80" width="20" height="20" fill="#e8dfcc" opacity="0.2"/>
  
  <!-- Shadow Block 5 -->
  <rect x="80" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
