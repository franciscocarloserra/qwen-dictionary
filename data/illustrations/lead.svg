  <rect x="80" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="90" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="100" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow Block 1 -->
  <rect x="40" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
  <rect x="40" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.4"/>
  <rect x="40" y="80" width="20" height="20" fill="#e8dfcc" opacity="0.2"/>
  
  <!-- Shadow Block 2 -->
  <rect x="50" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
  <rect x="50" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.4"/>
  <rect x="50" y="80" width="20" height="20" fill="#e8dfcc" opacity="0.2"/>
  
  <!-- Shadow Block 3 -->
  <rect x="60" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
