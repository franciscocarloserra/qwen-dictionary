<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main Lead Form -->
  <rect x="40" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="50" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
