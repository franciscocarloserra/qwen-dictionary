  <rect x="90" y="80" width="20" height="20" fill="#e8dfcc" opacity="0.2"/>
  
  <!-- Shadow Block 7 -->
  <rect x="100" y="60" width="20" height="20" fill="#e8dfcc" opacity="0.6"/>
  <rect x="100" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.4"/>
