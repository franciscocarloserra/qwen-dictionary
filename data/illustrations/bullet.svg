<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Main "bullet" shape -->
  <!-- Central core -->
  <rect x="25" y="25" width="50" height="50" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Left side of bullet -->
  <rect x="15" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Right side of bullet -->
  <rect x="75" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Top edge -->
  <line x1="25" y1="10" x2="25" y2="60" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Bottom edge -->
  <line x1="25" y1="60" x2="75" y2="60" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Left side of bullet -->
  <rect x="15" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Right side of bullet -->
  <rect x="75" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Top edge -->
  <line x1="25" y1="10" x2="25" y2="60" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Bottom edge -->
  <line x1="25" y1="60" x2="75" y2="60" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow (left side) -->
  <rect x="40" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow (right side) -->
  <rect x="60" y="10" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
