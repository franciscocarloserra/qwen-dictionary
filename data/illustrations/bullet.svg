  <!-- Texture hatching (top right) -->
  <path d="M 25 60 L 25 80 L 60 80 L 60 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  
  <!-- Texture hatching (bottom right) -->
