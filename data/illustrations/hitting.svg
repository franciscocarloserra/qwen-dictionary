<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#e8dfcc" />

  <!-- Main Form (Rect) -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Shadow Block 1 (Bottom Left) -->
  <rect x="30" y="50" width="20" height="30" fill="#e8dfcc" />

  <!-- Shadow Block 2 (Bottom Right) -->
  <rect x="70" y="50" width="20" height="30" fill="#e8dfcc" />

  <!-- Shadow Block 3 (Top Right) -->
  <rect x="40" y="30" width="20" height="30" fill="#e8dfcc" />

  <!-- Shadow Block 4 (Top Left) -->
  <rect x="20" y="10" width="20" height="30" fill="#e8dfcc" />

  <!-- Hatching Pattern (Parallel Lines) -->
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="20" y2="0" />
      <line x1="0" y1="0" x2="0" y2="20" />
    </pattern>
  </defs>
  <rect x="25" y="15" width="50" height="50" fill="#e8dfcc" />

  <!-- Additional small blocks for texture -->
  <rect x="45" y="25" width="10" height="10" fill="#e8dfcc" />
  <rect x="35" y="75" width="10" height="10" fill="#e8dfcc" />
  <rect x="65" y="75" width="10" height="10" fill="#e8dfcc" />
</g></svg>