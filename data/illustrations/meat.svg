<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut-hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#e8dfcc" stroke-width="2" />
      <line x1="0" y1="10" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" />
      <line x1="10" y1="0" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" />
      <line x1="10" y1="10" x2="0" y2="10" stroke="#e8dfcc" stroke-width="2" />
    </pattern>
  </defs>
  
  <rect x="5" y="5" width="90" height="90" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Main body shape -->
  <rect x="5" y="5" width="90" height="90" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Left side (vertical) -->
  <line x1="5" y1="5" x2="5" y2="90" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Right side (vertical) -->
  <line x1="85" y1="5" x2="85" y2="90" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Top horizontal -->
  <line x1="5" y1="5" x2="100" y2="5" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Bottom horizontal -->
  <line x1="5" y1="90" x2="100" y2="90" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Top-left corner detail -->
  <polygon points="5,5 10,5 20,10 25,5 30,15" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Top-right corner detail -->
  <polygon points="85,5 90,5 100,10 95,5 100,15" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Bottom-left corner detail -->
  <polygon points="5,90 10,90 20,95 25,90 30,95" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Bottom-right corner detail -->
  <polygon points="85,90 90,90 100,95 95,90 100,95" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow block (top right) -->
  <rect x="85" y="5" width="10" height="90" fill="#e8dfcc" />
  
  <!-- Shadow block (bottom left) -->
  <rect x="5" y="85" width="10" height="10" fill="#e8dfcc" />
  
  <!-- Shadow block (top left) -->
  <rect x="5" y="5" width="10" height="10" fill="#e8dfcc" />
  
  <!-- Shadow block (bottom right) -->
  <rect x="85" y="90" width="10" height="10" fill="#e8dfcc" />
  
  <!-- Hatching lines -->
  <line x1="5" y1="5" x2="5" y2="90" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="85" y1="5" x2="85" y2="90" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="5" y1="90" x2="5" y2="5" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="85" y1="90" x2="85" y2="5" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="4,4" />
</g></svg>