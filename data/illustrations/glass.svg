<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Glass body -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 1 (Top left) -->
  <rect x="10" y="20" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 2 (Top right) -->
  <rect x="40" y="20" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 3 (Bottom left) -->
  <rect x="10" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 4 (Bottom right) -->
  <rect x="40" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Top left shadow (darker) -->
  <rect x="10" y="20" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Top right shadow (darker) -->
  <rect x="40" y="20" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Bottom left shadow (darker) -->
  <rect x="10" y="40" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Bottom right shadow (darker) -->
  <rect x="40" y="40" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Texture 1: Top left -->
  <polyline points="20,20 25,15 25,25 20,30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Texture 2: Top right -->
  <polyline points="60,20 55,15 55,25 60,30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Texture 3: Bottom left -->
  <polyline points="20,40 25,35 25,45 20,50" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Texture 4: Bottom right -->
  <polyline points="60,40 55,35 55,45 60,50" fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>