<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Main body of the bag -->
  <g id="main-body">
    <!-- Rounded top rectangle -->
    <rect x="20" y="20" width="60" height="50" rx="15" ry="15" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Rounded bottom rectangle -->
    <rect x="20" y="50" width="60" height="50" rx="15" ry="15" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Rounded left side -->
    <rect x="5" y="20" width="20" height="30" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Rounded right side -->
    <rect x="70" y="20" width="20" height="30" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Rounded top corners -->
    <rect x="15" y="20" width="10" height="10" rx="2" ry="2" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <rect x="85" y="20" width="10" height="10" rx="2" ry="2" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <!-- Rounded bottom corners -->
    <rect x="15" y="50" width="10" height="10" rx="2" ry="2" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    <rect x="85" y="50" width="10" height="10" rx="2" ry="2" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  </g>
  
  <!-- Shadow 1 (Bottom Left) -->
  <rect x="20" y="60" width="30" height="25" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Shadow 2 (Bottom Right) -->
  <rect x="60" y="60" width="30" height="25" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Shadow 3 (Top Left) -->
  <rect x="20" y="20" width="30" height="15" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Shadow 4 (Top Right) -->
  <rect x="60" y="20" width="30" height="15" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Shadow 5 (Bottom Left) -->
  <rect x="20" y="60" width="30" height="15" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Shadow 6 (Bottom Right) -->
  <rect x="60" y="60" width="30" height="15" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Texture Hatching -->
  <g id="texture">
    <line x1="20" y1="20" x2="20" y2="50" stroke="#e8dfcc" stroke-width="0.5"/>
    <line x1="20" y1="50" x2="20" y2="20" stroke="#e8dfcc" stroke-width="0.5"/>
    <line x1="60" y1="20" x2="60" y2="50" stroke="#e8dfcc" stroke-width="0.5"/>
    <line x1="60" y1="50" x2="60" y2="20" stroke="#e8dfcc" stroke-width="0.5"/>
  </g>
</g></svg>