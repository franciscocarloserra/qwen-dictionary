<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main wall shape -->
  <rect x="20" y="20" width="60" height="60" rx="8" ry="8" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Horizontal accent line -->
  <line x1="20" y1="20" x2="20" y2="80" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Vertical accent line -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow block 1 (top right) -->
  <rect x="40" y="15" width="10" height="10" fill="#e8dfcc" rx="2" ry="2"/>
  
  <!-- Shadow block 2 (bottom right) -->
  <rect x="50" y="55" width="10" height="10" fill="#e8dfcc" rx="2" ry="2"/>
  
  <!-- Shadow block 3 (top left) -->
  <rect x="10" y="25" width="10" height="10" fill="#e8dfcc" rx="2" ry="2"/>
  
  <!-- Shadow block 4 (bottom left) -->
  <rect x="30" y="35" width="10" height="10" fill="#e8dfcc" rx="2" ry="2"/>
</g></svg>