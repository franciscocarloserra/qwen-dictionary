<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" />

  <!-- Main form (paper) -->
  <!-- Upper left corner -->
  <rect x="0" y="0" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="0" y="0" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Upper right corner -->
  <rect x="50" y="0" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="50" y="0" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Bottom left corner -->
  <rect x="0" y="80" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="0" y="80" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Bottom right corner -->
  <rect x="50" y="80" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="50" y="80" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Inner shadow area -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Texture hatching -->
  <path d="M 5 50 L 45 50 L 45 85 L 5 85 Z" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <path d="M 10 50 L 30 50 L 30 85 L 10 85 Z" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Shadow blocks -->
  <rect x="20" y="50" width="20" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="70" y="50" width="20" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="20" y="90" width="20" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="70" y="90" width="20" height="20" fill="#e8dfcc" stroke="none" />
</g></svg>