<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8dfcc" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Main tree trunk -->
  <rect x="30" y="20" width="40" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Branches -->
  <!-- Left branch -->
  <rect x="20" y="20" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="20" y="40" width="20" height="30" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="20" y="60" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Right branch -->
  <rect x="60" y="20" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="60" y="40" width="20" height="30" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="60" y="60" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Leaf 1 (left) -->
  <circle cx="35" cy="25" r="8" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="35" cy="25" r="5" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Leaf 2 (right) -->
  <circle cx="65" cy="25" r="8" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="65" cy="25" r="5" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Shadow on trunk -->
  <rect x="15" y="45" width="70" height="10" fill="#e8dfcc" opacity="0.6" />

  <!-- Shadow on right branch -->
  <rect x="55" y="45" width="50" height="10" fill="#e8dfcc" opacity="0.6" />

  <!-- Shadow on left branch -->
  <rect x="5" y="45" width="70" height="10" fill="#e8dfcc" opacity="0.6" />
</g></svg>