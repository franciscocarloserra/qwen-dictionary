<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut-texture" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e8dfcc" />
    </pattern>
  </defs>
  
  <!-- Main woodcut form with black outlines -->
  <g fill="none" stroke="#e8dfcc" stroke-width="1.5">
    <!-- Top section -->
    <rect x="10" y="20" width="40" height="30" rx="10" ry="10" />
    <!-- Left side -->
    <rect x="10" y="20" width="20" height="30" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1.5" />
    <!-- Right side -->
    <rect x="60" y="20" width="20" height="30" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1.5" />
    <!-- Bottom section -->
    <rect x="10" y="60" width="40" height="20" rx="10" ry="10" />
    <!-- Left side (darker shadow) -->
    <rect x="10" y="70" width="20" height="10" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1.5" />
    <!-- Right side (darker shadow) -->
    <rect x="60" y="70" width="20" height="10" rx="5" ry="5" fill="none" stroke="#e8dfcc" stroke-width="1.5" />
    
    <!-- Additional shadow blocks -->
    <rect x="15" y="85" width="20" height="10" rx="5" ry="5" fill="#e8dfcc" />
    <rect x="55" y="85" width="20" height="10" rx="5" ry="5" fill="#e8dfcc" />
    
    <!-- Top left shadow -->
    <rect x="10" y="90" width="20" height="10" rx="5" ry="5" fill="#e8dfcc" />
    <rect x="60" y="90" width="20" height="10" rx="5" ry="5" fill="#e8dfcc" />
  </g>
  
  <!-- Bottom shadow texture -->
  <path d="M 10 60 Q 30 70 50 60 M 10 60 Q 30 70 50 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 10 60 Q 30 70 50 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 10 60 Q 30 70 50 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 10 60 Q 30 70 50 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  
  <!-- Top right shadow texture -->
  <path d="M 60 60 Q 80 70 90 60 M 60 60 Q 80 70 90 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 60 60 Q 80 70 90 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 60 60 Q 80 70 90 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <path d="M 60 60 Q 80 70 90 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
</g></svg>