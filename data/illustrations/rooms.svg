<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- General grid background for texture -->
  <line x1="0" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="0" y1="100" x2="0" y2="100" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>