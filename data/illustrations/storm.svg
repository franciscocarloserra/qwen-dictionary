<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f" />
  
  <!-- Main Body (Woodcut style) -->
  <!-- Left side -->
  <rect x="30" y="30" width="50" height="60" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <rect x="30" y="60" width="50" height="30" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <rect x="30" y="90" width="50" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Right side -->
  <rect x="70" y="30" width="50" height="60" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <rect x="70" y="60" width="50" height="30" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  <rect x="70" y="90" width="50" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow areas -->
  <rect x="20" y="20" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8" />
  <rect x="60" y="20" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8" />
  <rect x="20" y="60" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8" />
  <rect x="60" y="60" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.8" />
  
  <!-- Texture Hatching -->
  <line x1="40" y1="40" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="40" y1="40" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="40" y1="40" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="40" y1="40" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  
  <!-- Top Edge (Line) -->
  <line x1="35" y1="10" x2="65" y2="10" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Bottom Edge (Line) -->
  <line x1="35" y1="90" x2="65" y2="90" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Left Edge (Line) -->
  <line x1="30" y1="30" x2="30" y2="10" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Right Edge (Line) -->
  <line x1="65" y1="30" x2="65" y2="10" stroke="#e8dfcc" stroke-width="2" />
</g></svg>