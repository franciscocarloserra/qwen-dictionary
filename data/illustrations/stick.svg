<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect width="20" height="20" fill="#e8dfcc" opacity="0.1"/>
    </pattern>
    <linearGradient id="woodcut-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8dfcc"/>
      <stop offset="100%" stop-color="#e8dfcc"/>
    </linearGradient>
  </defs>

  <!-- Main form (antique dictionary woodcut style) -->
  <rect x="10" y="20" width="80" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <path d="M10 20 L10 60 L60 60 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <rect x="10" y="20" width="80" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <path d="M10 20 L10 60 L60 60 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow 1 -->
  <rect x="30" y="20" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M30 20 L30 30 L60 30 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Shadow 2 -->
  <rect x="30" y="40" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M30 40 L30 50 L60 50 L60 40 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Shadow 3 -->
  <rect x="30" y="60" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M30 60 L30 70 L60 70 L60 60 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Textural hatching (short parallel lines) -->
  <rect x="20" y="20" width="60" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M20 20 L20 30 L60 30 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M20 20 L20 30 L60 30 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M20 20 L20 30 L60 30 L60 20 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Additional decorative elements -->
  <circle cx="10" cy="40" r="3" fill="#e8dfcc"/>
  <circle cx="40" cy="40" r="3" fill="#e8dfcc"/>
  <circle cx="60" cy="40" r="3" fill="#e8dfcc"/>
  <circle cx="10" cy="70" r="3" fill="#e8dfcc"/>
  <circle cx="40" cy="70" r="3" fill="#e8dfcc"/>
  <circle cx="60" cy="70" r="3" fill="#e8dfcc"/>
  <circle cx="10" cy="100" r="3" fill="#e8dfcc"/>
  <circle cx="40" cy="100" r="3" fill="#e8dfcc"/>
  <circle cx="60" cy="100" r="3" fill="#e8dfcc"/>
</g></svg>