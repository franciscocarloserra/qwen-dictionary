<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main cheese shape -->
  <polygon points="40,20 70,30 90,20 80,45 60,65 40,65 30,45 20,20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left side block -->
  <rect x="20" y="25" width="40" height="25" fill="#e8dfcc" stroke="none"/>
  
  <!-- Right side block -->
  <rect x="70" y="25" width="40" height="25" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow on left -->
  <rect x="20" y="50" width="40" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow on right -->
  <rect x="70" y="50" width="40" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching texture -->
  <polyline points="20,40 30,40 40,40 50,40 60,40 70,40 80,40 90,40 100,40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>