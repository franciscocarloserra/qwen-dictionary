<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="none"/>

  <!-- Main form: Hands -->
  <g transform="translate(25, 25)">
    <!-- Hand 1 (Thumb/Finger) -->
    <line x1="0" y1="0" x2="0" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <circle cx="0" cy="60" r="15" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <rect x="0" y="0" width="40" height="60" rx="8" ry="8" stroke="#e8dfcc" stroke-width="3" fill="none"/>

    <!-- Hand 2 (Index/Finger) -->
    <line x1="0" y1="0" x2="0" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <circle cx="0" cy="60" r="15" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#e8dfcc" stroke-width="3" fill="none"/>
    <rect x="0" y="0" width="40" height="60" rx="8" ry="8" stroke="#e8dfcc" stroke-width="3" fill="none"/>
  </g>

  <!-- Shadows -->
  <rect x="50" y="10" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="10" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="40" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="40" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Texture -->
  <path d="M 0 0 L 10 0 L 10 50 L 0 50 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.6"/>
  <path d="M 0 0 L 10 0 L 10 50 L 0 50 Z" fill="none" stroke="#e8dfcc" stroke-width="2" opacity="0.6"/>
</g></svg>