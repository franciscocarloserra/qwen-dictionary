<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="#16130f" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main body of the toilet -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Toilet seat -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Toilet bowl -->
  <ellipse cx="35" cy="45" rx="25" ry="22" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Toilet lid -->
  <rect x="20" y="30" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Toilet handle -->
  <rect x="50" y="40" width="10" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Toilet tank -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow on left side (tall) -->
  <rect x="20" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow on right side (short) -->
  <rect x="50" y="40" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Hatching texture -->
  <g fill="none" stroke="#e8dfcc" stroke-width="1.5">
    <line x1="20" y1="20" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="20"/>
    <line x1="60" y1="20" x2="20" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="20"/>
    <line x1="60" y1="20" x2="20" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="20"/>
  </g>
</g></svg>