<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut-texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="0.5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- Main form: vertical tear shape -->
  <rect x="10" y="50" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow block 1 -->
  <rect x="30" y="55" width="20" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block 2 -->
  <rect x="50" y="55" width="20" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block 3 -->
  <rect x="70" y="55" width="20" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Texture lines -->
  <polyline points="50,70 50,80 50,90 50,100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <polyline points="50,70 50,80 50,90 50,100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <polyline points="50,70 50,80 50,90 50,100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <polyline points="50,70 50,80 50,90 50,100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Top edge of tear -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Bottom edge of tear -->
  <line x1="10" y1="10" x2="90" y2="10" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left side -->
  <line x1="10" y1="50" x2="10" y2="10" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Right side -->
  <line x1="90" y1="50" x2="90" y2="10" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Inner dark tear -->
  <polygon points="30,50 50,40 70,50" fill="#e8dfcc" stroke="none"/>
</g></svg>