<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="#16130f" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main box -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Top edge -->
  <line x1="30" y1="10" x2="30" y2="40" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Bottom edge -->
  <line x1="30" y1="60" x2="30" y2="10" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left edge -->
  <line x1="10" y1="30" x2="10" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Right edge -->
  <line x1="70" y1="30" x2="70" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow block (top right) -->
  <rect x="45" y="20" width="10" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block (bottom right) -->
  <rect x="45" y="60" width="10" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block (top left) -->
  <rect x="5" y="20" width="10" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block (bottom left) -->
  <rect x="5" y="60" width="10" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching lines (top right) -->
  <polygon points="70,40 75,50 65,50" fill="#e8dfcc" opacity="0.6"/>
  
  <!-- Hatching lines (bottom right) -->
  <polygon points="70,60 65,70 75,70" fill="#e8dfcc" opacity="0.6"/>
  
  <!-- Hatching lines (top left) -->
  <polygon points="5,40 10,50 5,50" fill="#e8dfcc" opacity="0.6"/>
  
  <!-- Hatching lines (bottom left) -->
  <polygon points="5,60 10,70 5,70" fill="#e8dfcc" opacity="0.6"/>
</g></svg>