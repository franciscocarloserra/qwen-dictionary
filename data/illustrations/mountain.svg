<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" stroke="#16130f" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Mountain Base -->
  <polygon points="20,20 40,10 60,40 80,20 90,30 70,40 50,20 30,30 10,20" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round"/>

  <!-- Mountain Peak -->
  <polygon points="40,10 60,40 80,20 90,30 70,40 50,20 30,30 10,20" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linejoin="round"/>

  <!-- Shadows -->
  <rect x="30" y="30" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="30" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="30" y="40" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="40" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Texture Hatching -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="#16130f" stroke-width="1" stroke-linecap="round"/>

  <!-- Mountain Head -->
  <polygon points="30,20 40,10 50,20 60,40 70,20 80,30 90,40 100,10" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round"/>
  <polygon points="30,20 40,10 50,20 60,40 70,20 80,30 90,40 100,10" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round"/>
</g></svg>