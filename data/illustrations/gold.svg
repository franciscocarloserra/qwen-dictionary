<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><g fill="#e8dfcc">
  <defs>
    <pattern id="gold-hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#e8dfcc" stroke-width="2" />
      <line x1="20" y1="0" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" />
      <line x1="20" y1="20" x2="0" y2="20" stroke="#e8dfcc" stroke-width="2" />
      <line x1="0" y1="20" x2="0" y2="0" stroke="#e8dfcc" stroke-width="2" />
    </pattern>
  </defs>
  
  <!-- Main Gold Shape -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Inner Detail -->
  <rect x="10" y="10" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow Block 1 -->
  <rect x="80" y="50" width="20" height="20" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Shadow Block 2 -->
  <rect x="60" y="70" width="20" height="20" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Shadow Block 3 -->
  <rect x="40" y="90" width="20" height="20" fill="#e8dfcc" opacity="0.6" />
  
  <!-- Texture Lines -->
  <line x1="0" y1="0" x2="20" y2="0" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="20" y1="0" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="20" y1="20" x2="0" y2="20" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="0" y1="20" x2="0" y2="0" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,2" />
</g></svg>