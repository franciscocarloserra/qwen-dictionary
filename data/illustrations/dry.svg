<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Main form -->
  <polygon points="40,10 60,20 80,10 40,30 20,30 20,10" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadows -->
  <rect x="20" y="50" width="60" height="20" fill="#e8dfcc"/>
  <rect x="60" y="30" width="40" height="20" fill="#e8dfcc"/>
  <rect x="40" y="60" width="60" height="15" fill="#e8dfcc"/>

  <!-- Texture (short parallel hatching) -->
  <polygon points="40,10 60,20 80,10 40,30 20,30 20,10" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.5"/>
</g></svg>