<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none"/>
  
  <!-- Main form -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 1 -->
  <rect x="40" y="15" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="15" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="60" y="15" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="70" y="15" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="80" y="15" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 2 -->
  <rect x="30" y="35" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="60" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="70" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="80" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching Texture -->
  <path d="M 10 10 M 10 80 M 80 10 M 80 80 M 10 80 M 10 10 M 80 80 M 80 10" 
          fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Additional shadow detail -->
  <rect x="35" y="55" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="45" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="65" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="75" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="85" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>
</g></svg>