<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="none" />
  
  <!-- Base of the rose -->
  <rect x="10" y="30" width="80" height="30" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Petals -->
  <circle cx="20" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="30" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="40" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="50" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="60" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="70" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="80" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="90" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <circle cx="100" cy="50" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Center point -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow (left side) -->
  <rect x="20" y="40" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="25" y="45" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="20" y="55" width="30" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow (right side) -->
  <rect x="70" y="40" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="75" y="45" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="70" y="55" width="30" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Texture hatching (horizontal) -->
  <polyline points="70,50 70,55 70,60 70,65 70,70" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.5" />
  
  <!-- Texture hatching (vertical) -->
  <polyline points="50,50 45,55 40,60 35,65 30,70" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.5" />
</g></svg>