<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="yard-hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 10 M 10 10 L 0 10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Main yard shape (approximating a large grassy area) -->
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Inner grass detail -->
  <rect x="30" y="30" width="40" height="40" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <!-- Shadow blocks -->
  <rect x="10" y="50" width="40" height="20" fill="#e8dfcc"/>
  <rect x="50" y="50" width="40" height="20" fill="#e8dfcc"/>
  <rect x="80" y="50" width="40" height="20" fill="#e8dfcc"/>
  <rect x="10" y="70" width="40" height="20" fill="#e8dfcc"/>
  <rect x="50" y="70" width="40" height="20" fill="#e8dfcc"/>
  <rect x="80" y="70" width="40" height="20" fill="#e8dfcc"/>
  <rect x="10" y="90" width="40" height="20" fill="#e8dfcc"/>
  <rect x="50" y="90" width="40" height="20" fill="#e8dfcc"/>
  <rect x="80" y="90" width="40" height="20" fill="#e8dfcc"/>
  <rect x="10" y="110" width="40" height="20" fill="#e8dfcc"/>
  <rect x="50" y="110" width="40" height="20" fill="#e8dfcc"/>
  <rect x="80" y="110" width="40" height="20" fill="#e8dfcc"/>
  <!-- Parallel hatching lines -->
  <path d="M 30 30 L 30 40 M 30 30 L 30 40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 40 L 30 50 M 30 40 L 30 50" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 50 L 30 60 M 30 50 L 30 60" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 60 L 30 70 M 30 60 L 30 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 70 L 30 80 M 30 70 L 30 80" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 80 L 30 90 M 30 80 L 30 90" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 90 L 30 100 M 30 90 L 30 100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 100 L 30 110 M 30 100 L 30 110" fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>