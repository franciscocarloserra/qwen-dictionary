  <!-- Shadow on Right -->
  <rect x="70" y="20" width="10" height="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow on Left -->
  <rect x="0" y="20" width="10" height="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Mountain Face -->
  <rect x="10" y="20" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Mountain Body -->
  <rect x="30" y="20" width="30" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Mountain Peak -->
  <circle cx="40" cy="20" r="5" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Shadow on Right -->
  <rect x="70" y="20" width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
