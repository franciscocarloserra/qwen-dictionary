<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch-pattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="5,5"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="5,5"/>
      <line x1="0" y1="10" x2="10" y2="10" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="5,5"/>
