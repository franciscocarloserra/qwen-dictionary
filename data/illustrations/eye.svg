<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" />

  <!-- Main eye shape (stylized woodcut) -->
  <!-- Outer border: thick black line -->
  <path d="M 20 70 L 80 70 L 80 30 L 20 30 Z" fill="none" stroke="#e8dfcc" stroke-width="3" />
  <!-- Inner border: narrower black line -->
  <path d="M 20 70 L 40 70 L 40 30 L 20 30 Z" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Eyes (two circles) -->
  <circle cx="40" cy="70" r="25" fill="#e8dfcc" />
  <circle cx="60" cy="70" r="25" fill="#e8dfcc" />
  <!-- Pupils (smaller circles) -->
  <circle cx="35" cy="72" r="5" fill="#e8dfcc" />
  <circle cx="65" cy="72" r="5" fill="#e8dfcc" />
  <!-- Iris (small ellipse) -->
  <ellipse cx="40" cy="71" rx="12" ry="8" fill="#e8dfcc" />
  <ellipse cx="60" cy="71" rx="12" ry="8" fill="#e8dfcc" />
  <!-- Glint (small circle) -->
  <circle cx="45" cy="72" r="3" fill="#e8dfcc" />
  <circle cx="55" cy="72" r="3" fill="#e8dfcc" />
  <!-- Highlights (small circles) -->
  <circle cx="30" cy="65" r="2" fill="#e8dfcc" />
  <circle cx="60" cy="65" r="2" fill="#e8dfcc" />
  <!-- Shadow area (solid black rectangle) -->
  <rect x="30" y="70" width="40" height="40" fill="#e8dfcc" />
  <!-- Texture hatching (short parallel lines) -->
  <polygon points="30,70 35,72 40,74 45,72 50,70 45,68 50,72 55,74 60,72" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3" />
  <polygon points="30,70 35,72 40,74 45,72 50,70 45,68 50,72 55,74 60,72" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3" />
</g></svg>