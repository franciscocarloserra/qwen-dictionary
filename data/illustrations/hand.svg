<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="none"/>

  <!-- Main hand shape -->
  <!-- Thumb -->
  <polygon points="35,15 30,5 30,30 35,35" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <!-- Index -->
  <polygon points="45,10 50,5 50,30 45,35" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <!-- Middle -->
  <polygon points="50,15 45,5 45,30 50,35" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <!-- Ring -->
  <polygon points="65,10 60,5 60,30 65,35" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <!-- Pinky -->
  <polygon points="75,15 70,5 70,30 75,35" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadows -->
  <!-- Shadow behind thumb -->
  <rect x="25" y="25" width="50" height="30" fill="#e8dfcc" opacity="0.6"/>
  <!-- Shadow behind index -->
  <rect x="25" y="35" width="50" height="25" fill="#e8dfcc" opacity="0.6"/>
  <!-- Shadow behind middle -->
  <rect x="25" y="50" width="50" height="20" fill="#e8dfcc" opacity="0.6"/>
  <!-- Shadow behind ring -->
  <rect x="25" y="65" width="50" height="15" fill="#e8dfcc" opacity="0.6"/>
  <!-- Shadow behind pinky -->
  <rect x="25" y="80" width="50" height="10" fill="#e8dfcc" opacity="0.6"/>

  <!-- Texture hatching -->
  <polyline points="15 15 15 5 25 5 25 30 35 30 35 45 35" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3"/>
  <polyline points="15 15 15 5 25 5 25 30 35 30 35 45 35" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3"/>
</g></svg>