<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Main Body (Antique Woodcut Style) -->
  <polygon points="40,20 40,80 80,80 80,20 120,20 120,80 160,80 160,20" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Head -->
  <rect x="40" y="20" width="20" height="40" fill="#e8dfcc" stroke="none" />
  <rect x="40" y="20" width="20" height="40" fill="#e8dfcc" stroke="none" />

  <!-- Ears -->
  <rect x="40" y="60" width="20" height="20" fill="#e8dfcc" stroke="none" />
  <rect x="40" y="60" width="20" height="20" fill="#e8dfcc" stroke="none" />

  <!-- Nose -->
  <circle cx="55" cy="55" r="5" fill="#e8dfcc" stroke="none" />

  <!-- Eyes -->
  <circle cx="40" cy="45" r="3" fill="#e8dfcc" stroke="none" />
  <circle cx="60" cy="45" r="3" fill="#e8dfcc" stroke="none" />

  <!-- Mouth -->
  <path d="M 40 45 L 55 55 Z" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <path d="M 55 45 L 60 55 Z" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Lips -->
  <path d="M 40 45 L 45 55 Z" fill="#e8dfcc" stroke="none" />
  <path d="M 60 45 L 65 55 Z" fill="#e8dfcc" stroke="none" />

  <!-- Mouth Area (Shadow) -->
  <path d="M 40 45 L 55 55 L 55 45" fill="#e8dfcc" stroke="none" />

  <!-- Shadow -->
  <rect x="35" y="50" width="30" height="20" fill="#e8dfcc" stroke="none" />

  <!-- Ear Shadow -->
  <rect x="40" y="65" width="20" height="15" fill="#e8dfcc" stroke="none" />

  <!-- Ear -->
  <rect x="40" y="60" width="20" height="20" fill="#e8dfcc" stroke="none" />

  <!-- Nose Shadow -->
  <rect x="50" y="55" width="10" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Eye Shadow -->
  <rect x="35" y="50" width="10" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Eye Shadow -->
  <rect x="65" y="50" width="10" height="10" fill="#e8dfcc" stroke="none" />

  <!-- Texture Hatching -->
  <polyline points="40,20 40,80 80,80 80,20 120,20 120,80 160,80 160,20" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
  <polyline points="40,20 40,80 80,80 80,20 120,20 120,80 160,80 160,20" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6" />
</g></svg>