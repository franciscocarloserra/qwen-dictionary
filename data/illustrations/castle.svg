<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background texture with short parallel hatching -->
  <path fill="#e8dfcc" d="M0 40 L0 80 L40 80 L40 40 Z" stroke="none"/>
  
  <!-- Main castle silhouette -->
  <!-- Base shape -->
  <rect x="20" y="60" width="60" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Tower -->
  <rect x="20" y="100" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Main walls -->
  <rect x="40" y="40" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="60" y="60" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="30" y="80" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="70" y="80" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="90" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="70" y="90" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Roof -->
  <polygon points="40,10 50,20 60,10" fill="#e8dfcc" stroke="none"/>
  <polygon points="40,30 50,40 60,30" fill="#e8dfcc" stroke="none"/>
  <polygon points="40,50 50,60 60,50" fill="#e8dfcc" stroke="none"/>
  
  <!-- Details: Bell tower -->
  <rect x="20" y="120" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="25" y="120" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Details: Gatehouse -->
  <rect x="50" y="110" width="20" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="110" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Details: Window -->
  <rect x="45" y="100" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="100" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Details: Fireplace -->
  <rect x="45" y="100" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="100" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="45" y="110" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="110" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Details: Chimney -->
  <rect x="40" y="90" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="90" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow (solid black block) -->
  <rect x="20" y="60" width="60" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow (solid black block) -->
  <rect x="10" y="90" width="80" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow (solid black block) -->
  <rect x="10" y="110" width="80" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow (solid black block) -->
  <rect x="10" y="130" width="80" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow (solid black block) -->
  <rect x="10" y="150" width="80" height="10" fill="#e8dfcc" stroke="none"/>
</g></svg>