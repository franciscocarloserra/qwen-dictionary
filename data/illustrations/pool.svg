<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="pool-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 0 L 40 40 L 0 40 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Main Pool Shape -->
  <rect x="0" y="0" width="80" height="80" rx="20" ry="20" fill="none" stroke="#e8dfcc" stroke-width="4" />
  
  <!-- Shadow Block 1 (Bottom Left) -->
  <rect x="20" y="50" width="30" height="30" fill="#e8dfcc" />
  
  <!-- Shadow Block 2 (Bottom Right) -->
  <rect x="60" y="50" width="30" height="30" fill="#e8dfcc" />
  
  <!-- Shadow Block 3 (Top Left) -->
  <rect x="10" y="20" width="30" height="30" fill="#e8dfcc" />
  
  <!-- Shadow Block 4 (Top Right) -->
  <rect x="50" y="20" width="30" height="30" fill="#e8dfcc" />
  
  <!-- Hatching Lines -->
  <path d="M 10 20 L 10 30 L 10 50 L 10 60" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 50 20 L 50 30 L 50 50 L 50 60" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 10 50 L 10 60 L 10 70 L 10 80" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 50 50 L 50 60 L 50 70 L 50 80" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 10 80 L 10 90 L 10 100 L 10 110" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 50 80 L 50 90 L 50 100 L 50 110" stroke="#e8dfcc" stroke-width="2" fill="none" opacity="0.8"/>
</g></svg>