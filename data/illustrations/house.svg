<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Main house shape -->
  <!-- Roof -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <!-- Roof line -->
  <line x1="30" y1="30" x2="30" y2="10" stroke="#e8dfcc" stroke-width="1" />
  <line x1="70" y1="30" x2="70" y2="10" stroke="#e8dfcc" stroke-width="1" />

  <!-- Walls -->
  <!-- Left wall -->
  <rect x="10" y="30" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <!-- Right wall -->
  <rect x="70" y="30" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Eaves -->
  <rect x="10" y="60" width="60" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="70" y="60" width="60" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Chimney -->
  <rect x="35" y="65" width="10" height="15" fill="none" stroke="#e8dfcc" stroke-width="1" />

  <!-- Roof ridge -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="#e8dfcc" stroke-width="1" />

  <!-- Shadow (left) -->
  <rect x="15" y="40" width="25" height="15" fill="#e8dfcc" />
  <rect x="15" y="55" width="25" height="5" fill="#e8dfcc" />

  <!-- Shadow (right) -->
  <rect x="65" y="40" width="25" height="15" fill="#e8dfcc" />
  <rect x="65" y="55" width="25" height="5" fill="#e8dfcc" />

  <!-- Texture (hatching) -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="0.5" />
  <path d="M 0 0 L 100 0 L 100 100 L 0 100 Z" stroke="#e8dfcc" stroke-width="0.5" />
</g></svg>