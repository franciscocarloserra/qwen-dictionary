<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Main form of the rice -->
  <rect x="30" y="30" width="100" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Inner circle for center -->
  <circle cx="50" cy="30" r="15" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Top section -->
  <rect x="10" y="25" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="25" y="25" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Middle section -->
  <rect x="10" y="50" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="25" y="50" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Bottom section -->
  <rect x="10" y="80" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="25" y="80" width="30" height="25" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Shadow area -->
  <rect x="15" y="60" width="70" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Hatching texture -->
  <line x1="20" y1="60" x2="50" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="20" y1="60" x2="50" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="20" y1="60" x2="50" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="20" y1="60" x2="50" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="20" y1="60" x2="50" y2="60" stroke="#e8dfcc" stroke-width="1" />
</g></svg>