<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="none"/>

  <!-- Main body -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Top edge -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Left edge -->
  <line x1="20" y1="20" x2="20" y2="80" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Right edge -->
  <line x1="80" y1="50" x2="80" y2="80" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Bottom edge -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Left side (vertical) -->
  <rect x="20" y="40" width="10" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Right side (vertical) -->
  <rect x="70" y="40" width="10" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Top horizontal -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Bottom horizontal -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow (top-left) -->
  <rect x="10" y="25" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow (top-right) -->
  <rect x="70" y="25" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow (bottom-left) -->
  <rect x="10" y="65" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Shadow (bottom-right) -->
  <rect x="70" y="65" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Texture (short parallel hatching) -->
  <polyline points="20,50 20,65 80,65 80,50" fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>