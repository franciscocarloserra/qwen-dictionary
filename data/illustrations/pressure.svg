<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" />
      <line x1="20" y1="0" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" />
    </pattern>
  </defs>
  
  <!-- Main body with black outline and no fill -->
  <path d="M 30 40 L 70 40 L 70 70 L 30 70 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left side block -->
  <rect x="10" y="20" width="40" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Right side block -->
  <rect x="50" y="20" width="40" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Top edge -->
  <line x1="10" y1="40" x2="90" y2="40" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Bottom edge -->
  <line x1="10" y1="70" x2="90" y2="70" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left side vertical -->
  <line x1="10" y1="20" x2="10" y2="70" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Right side vertical -->
  <line x1="50" y1="20" x2="50" y2="70" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Top edge lines -->
  <line x1="10" y1="40" x2="10" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="10" y1="40" x2="90" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="50" y1="40" x2="50" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="50" y1="40" x2="90" y2="60" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Bottom edge lines -->
  <line x1="10" y1="70" x2="10" y2="90" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="10" y1="70" x2="90" y2="90" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="#e8dfcc" stroke-width="2"/>
  <line x1="50" y1="70" x2="90" y2="90" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow on left -->
  <rect x="30" y="25" width="20" height="25" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow on right -->
  <rect x="70" y="25" width="20" height="25" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow on top -->
  <rect x="30" y="35" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow on bottom -->
  <rect x="70" y="35" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Texture hatching -->
  <path d="M 10 40 L 10 60 L 90 60 L 90 40 Z" fill="#e8dfcc" stroke="none"/>
</g></svg>