<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Main body shape -->
  <rect x="20" y="40" width="60" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow block 1 -->
  <rect x="25" y="45" width="25" height="20" fill="#e8dfcc"/>
  
  <!-- Shadow block 2 -->
  <rect x="45" y="50" width="20" height="20" fill="#e8dfcc"/>
  
  <!-- Shadow block 3 -->
  <rect x="35" y="60" width="25" height="15" fill="#e8dfcc"/>
  
  <!-- Shadow block 4 -->
  <rect x="55" y="55" width="20" height="15" fill="#e8dfcc"/>
  
  <!-- Texture hatching -->
  <polyline points="65,70 75,85 85,95 70,110 60,125 50,135 40,145" 
            fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>