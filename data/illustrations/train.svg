<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main Train Body -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="40" cy="30" r="10" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Nose -->
  <circle cx="35" cy="35" r="3" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Ears -->
  <circle cx="20" cy="30" r="3" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  <circle cx="50" cy="30" r="3" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Back of Head -->
  <rect x="25" y="30" width="5" height="25" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Front of Head -->
  <rect x="35" y="30" width="5" height="25" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Neck -->
  <rect x="20" y="50" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Tail -->
  <rect x="35" y="70" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Wheels -->
  <circle cx="30" cy="70" r="5" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="5" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Wheels on sides -->
  <circle cx="25" cy="70" r="3" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  <circle cx="75" cy="70" r="3" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  
  <!-- Side Details -->
  <rect x="25" y="80" width="5" height="15" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
  <rect x="75" y="80" width="5" height="15" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>
</g></svg>