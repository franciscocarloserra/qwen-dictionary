<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#e8dfcc">
  <defs>
    <style>
      .line { stroke: #e8dfcc; stroke-width: 1; fill: none; }
      .shadow { fill: #e8dfcc; opacity: 0.8; }
      .hatch { fill: #e8dfcc; opacity: 0.6; }
    </style>
  </defs>
  
  <!-- Main body of the clothes -->
  <polygon class="line" points="40,25 30,50 40,75 30,95 40,100 50,75 40,50 30,25"/>
  
  <!-- Left side -->
  <rect class="line" x="20" y="20" width="10" height="30"/>
  <rect class="line" x="20" y="50" width="10" height="30"/>
  <rect class="line" x="20" y="80" width="10" height="30"/>
  
  <!-- Right side -->
  <rect class="line" x="80" y="20" width="10" height="30"/>
  <rect class="line" x="80" y="50" width="10" height="30"/>
  <rect class="line" x="80" y="80" width="10" height="30"/>
  
  <!-- Legs -->
  <rect class="line" x="15" y="20" width="10" height="40"/>
  <rect class="line" x="85" y="20" width="10" height="40"/>
  
  <!-- Sash/Stripes -->
  <polyline class="line" points="25,25 35,50 45,75 55,95 65,100 75,75 85,50 95,25"/>
  <polyline class="line" points="25,50 35,75 45,95 55,100 65,75 75,50 85,75 95,95 105,100 115,75 125,50 135,25"/>
  
  <!-- Shadows -->
  <rect class="shadow" x="20" y="25" width="60" height="10"/>
  <rect class="shadow" x="20" y="50" width="60" height="10"/>
  <rect class="shadow" x="20" y="75" width="60" height="10"/>
  <rect class="shadow" x="20" y="95" width="60" height="10"/>
  
  <!-- Texture hatching -->
  <polygon class="hatch" points="30,20 40,25 50,30 60,35 70,40 80,45 90,50 100,55 110,50 120,45 130,40 140,35 150,30 160,25 170,20 180,15 190,10 200,5 210,0"/>
  <polygon class="hatch" points="30,50 40,55 50,60 60,65 70,70 80,75 90,80 100,85 110,80 120,75 130,70 140,65 150,60 160,55 170,50 180,45 190,40 200,35 210,30 220,25 230,20 240,15 250,10 260,5 270,0"/>
</g></svg>