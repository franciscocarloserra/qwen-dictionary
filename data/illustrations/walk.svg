<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main Walk Shape (Top) -->
  <path d="M 20 20 L 40 20 L 40 60 L 20 60 Z" fill="none" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 20 L 40 20 L 40 60 L 20 60 Z" fill="none" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Main Walk Shape (Bottom) -->
  <path d="M 20 60 L 40 60 L 40 20 L 20 20 Z" fill="none" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 60 L 40 60 L 40 20 L 20 20 Z" fill="none" stroke="#e8dfcc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Shadow (Left) -->
  <rect x="10" y="35" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="10" y="50" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow (Right) -->
  <rect x="90" y="35" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="90" y="50" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow (Bottom) -->
  <rect x="10" y="60" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="90" y="60" width="10" height="10" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Texture Hatching (Top) -->
  <polyline points="20 20 40 20 40 60 20 60 20 100 40 100 40 100" fill="none" stroke="#e8dfcc" stroke-width="0.5" stroke-dasharray="5,5"/>
  
  <!-- Texture Hatching (Bottom) -->
  <polyline points="20 60 40 60 40 100 20 100 20 50 40 50 40 50" fill="none" stroke="#e8dfcc" stroke-width="0.5" stroke-dasharray="5,5"/>
</g></svg>