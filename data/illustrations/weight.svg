<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background shadow -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left edge line -->
  <line x1="0" y1="10" x2="0" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Top edge line -->
  <line x1="0" y1="0" x2="100" y2="0" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Right edge line -->
  <line x1="100" y1="0" x2="100" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Bottom edge line -->
  <line x1="100" y1="100" x2="0" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Main form shape (approximate "weight" shape) -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 1 -->
  <rect x="10" y="30" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 2 -->
  <rect x="30" y="10" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 3 -->
  <rect x="30" y="60" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 4 -->
  <rect x="30" y="10" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Hatching texture (top right) -->
  <g stroke="#e8dfcc" stroke-width="1" fill="none">
    <line x1="50" y1="20" x2="60" y2="30" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="50" y1="70" x2="60" y2="80" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="60" y1="20" x2="70" y2="30" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="60" y1="70" x2="70" y2="80" stroke="#e8dfcc" stroke-width="1"/>
  </g>
  
  <!-- Hatching texture (bottom left) -->
  <g stroke="#e8dfcc" stroke-width="1" fill="none">
    <line x1="10" y1="50" x2="20" y2="60" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="10" y1="90" x2="20" y2="100" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="20" y1="50" x2="30" y2="60" stroke="#e8dfcc" stroke-width="1"/>
    <line x1="20" y1="90" x2="30" y2="100" stroke="#e8dfcc" stroke-width="1"/>
  </g>
</g></svg>