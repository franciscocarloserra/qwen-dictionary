<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" stroke="#c9a45c" stroke-width="2"/>

  <!-- Main form (paint) -->
  <rect x="10" y="10" width="80" height="70" fill="#c9a45c" stroke="#c9a45c" stroke-width="1"/>

  <!-- Shadows (solid black blocks) -->
  <rect x="20" y="25" width="30" height="20" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="60" y="30" width="40" height="25" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="85" y="5" width="20" height="15" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Texture (short parallel hatching) -->
  <rect x="15" y="45" width="70" height="40" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="18" y="55" width="65" height="45" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="25" y="65" width="60" height="50" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Details -->
  <circle cx="35" cy="55" r="4" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <ellipse cx="45" cy="60" rx="10" ry="8" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <circle cx="55" cy="40" r="3" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <circle cx="50" cy="70" r="5" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <ellipse cx="55" cy="65" rx="6" ry="5" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <circle cx="65" cy="50" r="4" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
  <ellipse cx="65" cy="60" rx="5" ry="4" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="0.5"/>
</g></svg>