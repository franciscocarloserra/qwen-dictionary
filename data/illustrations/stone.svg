<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Stone background -->
  <rect x="20" y="20" width="60" height="60" fill="#16130f" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Main form -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="20" y="20" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="40" y="20" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="40" y="40" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow 1 -->
  <rect x="50" y="10" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="50" y="50" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Shadow 2 -->
  <rect x="50" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Hatching texture -->
  <polyline points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  <polyline points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  <polyline points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  <polyline points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  
  <!-- Texture detail 1 -->
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  
  <!-- Texture detail 2 -->
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  <polygon points="50,10 50,20 50,30 50,40 50,50" fill="none" stroke="#e8dfcc" stroke-width="0.2"/>
  
  <!-- Decorative element -->
  <circle cx="45" cy="65" r="5" fill="#e8dfcc"/>
</g></svg>