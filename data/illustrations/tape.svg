<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#e8dfcc">
  <defs>
    <pattern id="tape-texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#e8dfcc" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="100" stroke="#e8dfcc" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#e8dfcc" stroke="none" />

  <!-- Main tape form -->
  <polygon points="10,10 50,10 50,50 10,50 10,10" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Shadow 1: Top right shadow -->
  <rect x="30" y="30" width="40" height="40" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 2: Bottom left shadow -->
  <rect x="20" y="60" width="40" height="40" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 3: Top left shadow -->
  <rect x="10" y="10" width="40" height="40" fill="#e8dfcc" stroke="none" />

  <!-- Shadow 4: Bottom right shadow -->
  <rect x="60" y="20" width="40" height="40" fill="#e8dfcc" stroke="none" />

  <!-- Texture lines -->
  <line x1="0" y1="0" x2="100" y2="0" stroke="#e8dfcc" stroke-width="2" />
  <line x1="0" y1="0" x2="0" y2="100" stroke="#e8dfcc" stroke-width="2" />
</g></svg>