<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="none"/>

  <!-- Main body shape -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Neck area -->
  <rect x="10" y="30" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Chest cavity -->
  <rect x="10" y="50" width="80" height="40" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Shoulder area -->
  <rect x="10" y="70" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Arm area -->
  <rect x="10" y="90" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Chest folds -->
  <line x1="40" y1="50" x2="40" y2="65" stroke="#e8dfcc" stroke-width="1"/>
  <line x1="40" y1="65" x2="40" y2="70" stroke="#e8dfcc" stroke-width="1.5"/>
  <line x1="40" y1="70" x2="40" y2="75" stroke="#e8dfcc" stroke-width="1.5"/>
  <line x1="40" y1="75" x2="40" y2="80" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Chest folds (lower) -->
  <line x1="40" y1="75" x2="40" y2="85" stroke="#e8dfcc" stroke-width="1.5"/>
  <line x1="40" y1="85" x2="40" y2="90" stroke="#e8dfcc" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="40" y2="95" stroke="#e8dfcc" stroke-width="1.5"/>

  <!-- Shadow on left side -->
  <rect x="30" y="45" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="35" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow on right side -->
  <rect x="50" y="45" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="55" y="55" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Texture hatching (horizontal) -->
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>

  <!-- Texture hatching (vertical) -->
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
  <path d="M 10 10 L 10 30 L 30 30 L 30 10" stroke="#e8dfcc" stroke-width="1" fill="none"/>
</g></svg>