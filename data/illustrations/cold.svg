<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="woodcut-texture" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main body -->
  <rect x="20" y="20" width="60" height="60" rx="8" ry="8" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow -->
  <rect x="20" y="20" width="60" height="60" rx="8" ry="8" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Hatching -->
  <line x1="20" y1="20" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" opacity="0.8"/>
  <line x1="20" y1="20" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2" opacity="0.8"/>
  
  <!-- Ear -->
  <rect x="40" y="60" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Nose -->
  <rect x="30" y="40" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Mouth -->
  <rect x="20" y="45" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="55" r="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  <circle cx="55" cy="55" r="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Lip -->
  <rect x="20" y="65" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Ear (left) -->
  <rect x="60" y="60" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Ear (right) -->
  <rect x="80" y="60" width="20" height="20" rx="4" ry="4" fill="none" stroke="#e8dfcc" stroke-width="2"/>
</g></svg>