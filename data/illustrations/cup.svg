<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Main body -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Top rim -->
  <rect x="15" y="15" width="70" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Bottom rim -->
  <rect x="15" y="80" width="70" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Left side (handle) -->
  <rect x="5" y="30" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Right side (handle) -->
  <rect x="65" y="30" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Left handle cap -->
  <rect x="10" y="35" width="20" height="15" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Right handle cap -->
  <rect x="60" y="35" width="20" height="15" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Left base -->
  <rect x="5" y="50" width="30" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Right base -->
  <rect x="65" y="50" width="30" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Left shadow -->
  <rect x="10" y="60" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Right shadow -->
  <rect x="60" y="60" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Top shadow -->
  <rect x="10" y="45" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Bottom shadow -->
  <rect x="10" y="85" width="40" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Hatching texture -->
  <polyline points="10,25 10,35 20,25" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,35 10,45 20,35" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,45 10,55 20,45" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,55 10,65 20,55" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,65 10,75 20,65" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,75 10,85 20,75" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,85 10,95 20,85" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
  <polyline points="10,95 10,105 20,95" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.6"/>
</g></svg>