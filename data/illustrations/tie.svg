  <!-- Hatching 1 -->
  <path d="M 10 60 L 10 100 L 40 100 L 40 60 L 10 60 Z" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Hatching 2 -->
  <path d="M 10 60 L 10 100 L 40 100 L 40 60 L 10 60 Z" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <!-- Hatching 3 -->
