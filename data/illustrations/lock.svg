<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main lock shape with black outline -->
  <polygon points="40,10 70,40 40,70 10,40" fill="none" stroke="#e8dfcc" stroke-width="2"/>

  <!-- Top horizontal bar -->
  <rect x="20" y="30" width="60" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Left vertical bar -->
  <rect x="10" y="30" width="10" height="70" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Right vertical bar -->
  <rect x="80" y="30" width="10" height="70" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Bottom horizontal bar -->
  <rect x="20" y="70" width="60" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Top-left corner block (shadow) -->
  <rect x="20" y="20" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Top-right corner block (shadow) -->
  <rect x="60" y="20" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Bottom-left corner block (shadow) -->
  <rect x="20" y="70" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Bottom-right corner block (shadow) -->
  <rect x="60" y="70" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Decorative hatching texture -->
  <pattern id="hatch" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 0 0 L 0 100 M 50 0 L 50 100 M 0 100 L 50 100" fill="none" stroke="#e8dfcc" stroke-width="0.5"/>
  </pattern>

  <!-- Apply hatching to lock body area -->
  <rect x="20" y="30" width="60" height="40" fill="#e8dfcc" opacity="0.2"/>

  <!-- Add a small decorative block on the left side -->
  <rect x="10" y="30" width="10" height="30" fill="#e8dfcc" stroke="none"/>

  <!-- Add a small decorative block on the right side -->
  <rect x="80" y="30" width="10" height="30" fill="#e8dfcc" stroke="none"/>
</g></svg>