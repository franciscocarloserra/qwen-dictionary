<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="10" y="10" width="80" height="80" fill="#16130f" stroke="#16130f" stroke-width="2"/>

  <!-- Main window shape (woodblock style) -->
  <!-- Outer rectangle -->
  <rect x="20" y="20" width="60" height="60" fill="#e8dfcc" stroke="#c9a45c" stroke-width="2"/>
  <!-- Inner rectangle -->
  <rect x="25" y="25" width="35" height="35" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1.5"/>
  <!-- Inner rectangle (left) -->
  <rect x="5" y="25" width="30" height="35" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1.5"/>
  <!-- Inner rectangle (right) -->
  <rect x="55" y="25" width="35" height="35" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1.5"/>
  <!-- Outer rectangle (top) -->
  <rect x="20" y="30" width="60" height="30" fill="#e8dfcc" stroke="#c9a45c" stroke-width="2"/>
  <!-- Outer rectangle (bottom) -->
  <rect x="20" y="60" width="60" height="30" fill="#e8dfcc" stroke="#c9a45c" stroke-width="2"/>

  <!-- Shadows (solid black blocks) -->
  <rect x="35" y="15" width="30" height="15" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="25" y="35" width="15" height="25" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="70" y="35" width="15" height="25" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="25" y="65" width="15" height="25" fill="#e8dfcc" stroke="#e8dfcc" stroke-width="1"/>

  <!-- Texture (short parallel hatching) -->
  <g fill="#c9a45c">
    <polyline points="10 10 30 10 50 10 60 10 80 10 100 10 120 10 140 10 160 10 180 10" 
              stroke="#c9a45c" stroke-width="2" opacity="0.5"/>
  </g>
</g></svg>