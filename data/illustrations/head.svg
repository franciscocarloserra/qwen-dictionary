<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="2" />

  <!-- Main body -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="2" />
  <rect x="30" y="30" width="40" height="40" fill="#e8dfcc" />

  <!-- Left eye -->
  <circle cx="45" cy="50" r="3" fill="#e8dfcc" />
  <circle cx="45" cy="50" r="2" fill="#e8dfcc" />
  <circle cx="45" cy="50" r="1" fill="#e8dfcc" />
  <line x1="45" y1="50" x2="45" y2="52" stroke="#e8dfcc" stroke-width="1" />

  <!-- Right eye -->
  <circle cx="75" cy="50" r="3" fill="#e8dfcc" />
  <circle cx="75" cy="50" r="2" fill="#e8dfcc" />
  <circle cx="75" cy="50" r="1" fill="#e8dfcc" />
  <line x1="75" y1="50" x2="75" y2="52" stroke="#e8dfcc" stroke-width="1" />

  <!-- Nose -->
  <rect x="45" y="50" width="10" height="10" fill="#e8dfcc" />
  <rect x="45" y="50" width="10" height="10" fill="#e8dfcc" />

  <!-- Mouth -->
  <rect x="45" y="70" width="10" height="10" fill="#e8dfcc" />
  <rect x="45" y="70" width="10" height="10" fill="#e8dfcc" />

  <!-- Left ear (chin) -->
  <rect x="20" y="80" width="10" height="10" fill="#e8dfcc" />
  <rect x="20" y="80" width="10" height="10" fill="#e8dfcc" />

  <!-- Right ear (chin) -->
  <rect x="80" y="80" width="10" height="10" fill="#e8dfcc" />
  <rect x="80" y="80" width="10" height="10" fill="#e8dfcc" />

  <!-- Shadow on left eye -->
  <rect x="45" y="55" width="10" height="10" fill="#e8dfcc" />
  <rect x="45" y="55" width="10" height="10" fill="#e8dfcc" />

  <!-- Shadow on right eye -->
  <rect x="75" y="55" width="10" height="10" fill="#e8dfcc" />
  <rect x="75" y="55" width="10" height="10" fill="#e8dfcc" />

  <!-- Texture hatching (left side) -->
  <line x1="30" y1="20" x2="30" y2="40" stroke="#e8dfcc" stroke-width="1" />
  <line x1="30" y1="40" x2="30" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="30" y1="60" x2="30" y2="80" stroke="#e8dfcc" stroke-width="1" />

  <!-- Texture hatching (right side) -->
  <line x1="70" y1="20" x2="70" y2="40" stroke="#e8dfcc" stroke-width="1" />
  <line x1="70" y1="40" x2="70" y2="60" stroke="#e8dfcc" stroke-width="1" />
  <line x1="70" y1="60" x2="70" y2="80" stroke="#e8dfcc" stroke-width="1" />
</g></svg>