<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 20 0 L 20 20 L 0 20 Z" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Main form: darkened rectangle -->
  <rect x="40" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Left wall -->
  <rect x="0" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Right wall -->
  <rect x="80" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="100" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Floor -->
  <rect x="0" y="80" width="100" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Door frame -->
  <rect x="20" y="40" width="60" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Door -->
  <rect x="30" y="60" width="40" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Handle -->
  <rect x="40" y="60" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Handle knob -->
  <circle cx="40" cy="60" r="3" fill="#e8dfcc" stroke="none"/>

  <!-- Door panel (right side) -->
  <rect x="70" y="60" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Door panel (left side) -->
  <rect x="10" y="60" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Light fixture (center top) -->
  <rect x="40" y="20" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Light fixture (right side) -->
  <rect x="80" y="20" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Light fixture (left side) -->
  <rect x="0" y="20" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow on left -->
  <rect x="20" y="60" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow on right -->
  <rect x="80" y="60" width="10" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadow on floor -->
  <rect x="40" y="80" width="20" height="20" fill="#e8dfcc" stroke="none"/>

  <!-- Shadows on walls -->
  <rect x="20" y="60" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="80" y="60" width="10" height="10" fill="#e8dfcc" stroke="none"/>

  <!-- Texture lines (hatching) -->
  <polyline points="40,65 50,75 60,85 70,95 80,105 90,115 100,125" fill="#e8dfcc" stroke="none"/>
</g></svg>