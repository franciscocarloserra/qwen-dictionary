  <circle cx="30" cy="80" r="5" fill="#e8dfcc"/>
  <circle cx="70" cy="80" r="5" fill="#e8dfcc"/>
  
  <!-- Center core -->
  <circle cx="40" cy="40" r="2" fill="#e8dfcc"/>
  
  <!-- Shadow block -->
  <rect x="30" y="35" width="30" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="35" y="40" width="30" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="30" y="45" width="30" height="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching texture -->
  <path d="M 30 70 L 30 75 L 60 75 L 60 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 70 L 30 75 L 60 75 L 60 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 70 L 30 75 L 60 75 L 60 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 70 L 30 75 L 60 75 L 60 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <path d="M 30 70 L 30 75 L 60 75 L 60 70" fill="none" stroke="#e8dfcc" stroke-width="1"/>
</g></svg>