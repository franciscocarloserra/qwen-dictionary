<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Main Form (Flower-like shape) -->
  <path d="M 20 70 L 60 70 L 60 30 L 20 30 Z" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Petals -->
  <circle cx="30" cy="60" r="5" fill="#e8dfcc"/>
  <circle cx="70" cy="60" r="5" fill="#e8dfcc"/>
  <circle cx="30" cy="40" r="5" fill="#e8dfcc"/>
