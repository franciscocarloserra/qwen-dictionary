<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#16130f" />
  
  <!-- Bridge Main Structure -->
  <rect x="10" y="10" width="80" height="70" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Main Beam -->
  <rect x="10" y="20" width="80" height="50" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Side Pillars -->
  <rect x="10" y="30" width="10" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="80" y="30" width="10" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Floor -->
  <rect x="10" y="70" width="80" height="30" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Top Rail -->
  <rect x="10" y="50" width="80" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Decorative Elements -->
  <rect x="15" y="45" width="20" height="10" fill="#e8dfcc" />
  <rect x="65" y="45" width="20" height="10" fill="#e8dfcc" />
  
  <!-- Shadow -->
  <rect x="10" y="70" width="80" height="15" fill="#e8dfcc" />
  
  <!-- Texture Hatching -->
  <polyline points="0,80 10,80 20,80 30,80 40,80 50,80 60,80 70,80 80,80 90,80" fill="#e8dfcc" opacity="0.3" />
</g></svg>