<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Shadow Block 1 -->
  <rect x="40" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow Block 2 -->
  <rect x="40" y="10" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow Block 3 -->
  <rect x="40" y="50" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Horse Head -->
  <rect x="30" y="20" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="25" cy="35" r="2" fill="#e8dfcc"/>
  
  <!-- Ears -->
  <polygon points="30,20 50,15 30,25" fill="#e8dfcc" stroke="none"/>
  <polygon points="30,20 50,15 30,25" fill="#e8dfcc" stroke="none"/>
  
  <!-- Neck -->
  <rect x="30" y="35" width="30" height="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Body -->
  <rect x="30" y="45" width="30" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Mane -->
  <polygon points="30,55 60,55 60,75 30,75" fill="#e8dfcc" stroke="none"/>
  
  <!-- Tail -->
  <polygon points="30,85 60,85 60,105 30,105" fill="#e8dfcc" stroke="none"/>
  
  <!-- Legs -->
  <rect x="30" y="75" width="10" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="30" y="75" width="10" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="75" width="10" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="50" y="75" width="10" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Mane -->
  <polygon points="30,55 60,55 60,75 30,75" fill="#e8dfcc" stroke="none"/>
  
  <!-- Mane -->
  <polygon points="30,55 60,55 60,75 30,75" fill="#e8dfcc" stroke="none"/>
  
  <!-- Mane -->
  <polygon points="30,55 60,55 60,75 30,75" fill="#e8dfcc" stroke="none"/>
</g></svg>