<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f"/>
  
  <!-- Main form (streets) -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow -->
  <rect x="50" y="30" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Hatching texture -->
  <polyline points="30,20 40,20 30,30 40,30 50,30 60,30 50,40 60,40 70,40 60,50 70,50 80,50 70,60 80,60 90,60 80,70 90,70 100,70 90,80 100,80" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Detail 1: Corner detail -->
  <rect x="25" y="25" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="25" y="25" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Detail 2: Roof detail -->
  <rect x="10" y="10" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="10" y="10" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="10" y="10" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="10" y="10" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Detail 3: Street edge detail -->
  <rect x="5" y="5" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  <rect x="5" y="5" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="1"/>
  
  <!-- Detail 4: Side detail -->
  <rect x="45" y="45" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  <rect x="45" y="45" width="15" height="15" fill="#e8dfcc" stroke="none"/>
  
  <!-- Detail 5: Corner detail 2 -->
  <rect x="35" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
  <rect x="35" y="35" width="10" height="10" fill="#e8dfcc" stroke="none"/>
</g></svg>