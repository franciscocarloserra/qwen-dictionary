<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background (texture) -->
  <rect x="0" y="0" width="100" height="100" fill="#e8dfcc" opacity="0.4"/>
  <defs>
    <pattern id="hex" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="5" fill="#e8dfcc"/>
    </pattern>
  </defs>
  <!-- Main form (antique woodcut style) -->
  <!-- Left eye -->
  <rect x="20" y="20" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left eye shadow -->
  <rect x="20" y="20" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right eye -->
  <rect x="70" y="20" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right eye shadow -->
  <rect x="70" y="20" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Texture lines -->
  <line x1="20" y1="20" x2="30" y2="30" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="70" y1="20" x2="80" y2="30" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="70" x2="30" y2="80" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="70" y1="70" x2="80" y2="80" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>