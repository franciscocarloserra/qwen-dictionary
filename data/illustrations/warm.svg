<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect width="100" height="100" fill="#16130f" />
  
  <!-- Main Body -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e8dfcc" stroke-width="2" />
  
  <!-- Left Shadow -->
  <rect x="20" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Right Shadow -->
  <rect x="80" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Top Shadow -->
  <rect x="20" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Bottom Shadow -->
  <rect x="20" y="80" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Left Shadow -->
  <rect x="20" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Right Shadow -->
  <rect x="80" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Top Shadow -->
  <rect x="20" y="20" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Bottom Shadow -->
  <rect x="20" y="80" width="20" height="20" fill="#e8dfcc" />
  
  <!-- Texture Hatching -->
  <polygon points="50,10 100,10 100,80 50,80" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3" />
  <polygon points="50,10 100,10 100,80 50,80" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.3" />
  
  <!-- Left Shadow -->
  <polygon points="20,20 20,30 20,40 20,50" fill="#e8dfcc" />
  
  <!-- Right Shadow -->
  <polygon points="80,20 80,30 80,40 80,50" fill="#e8dfcc" />
  
  <!-- Top Shadow -->
  <polygon points="20,20 20,30 20,40 20,50" fill="#e8dfcc" />
  
  <!-- Bottom Shadow -->
  <polygon points="20,80 20,90 20,100 20,110" fill="#e8dfcc" />
  
  <!-- Left Shadow -->
  <polygon points="20,20 20,30 20,40 20,50" fill="#e8dfcc" />
  
  <!-- Right Shadow -->
  <polygon points="80,20 80,30 80,40 80,50" fill="#e8dfcc" />
  
  <!-- Top Shadow -->
  <polygon points="20,20 20,30 20,40 20,50" fill="#e8dfcc" />
  
  <!-- Bottom Shadow -->
  <polygon points="20,80 20,90 20,100 20,110" fill="#e8dfcc" />
</g></svg>