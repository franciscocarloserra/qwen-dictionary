<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="display: inline-block; width: 100px; height: 100px; line-height: 100%; fill: none; stroke: #e8dfcc; stroke-width: 1.5;"><g fill="#e8dfcc">
  <!-- Shadow block 1 -->
  <rect x="0" y="50" width="100" height="20" rx="10" ry="10" fill="#e8dfcc" stroke="none"/>
  <rect x="0" y="70" width="100" height="10" rx="5" ry="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block 2 -->
  <rect x="20" y="25" width="60" height="10" rx="5" ry="5" fill="#e8dfcc" stroke="none"/>
  <rect x="20" y="40" width="60" height="10" rx="5" ry="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow block 3 -->
  <rect x="40" y="25" width="60" height="10" rx="5" ry="5" fill="#e8dfcc" stroke="none"/>
  <rect x="40" y="40" width="60" height="10" rx="5" ry="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Hatching -->
  <polyline points="60 40 80 40 90 45 100 40" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 50 80 50 90 55 100 50" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 60 80 60 90 65 100 60" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 70 80 70 90 75 100 70" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 80 80 80 90 85 100 80" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 90 80 90 90 95 100 90" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
  <polyline points="60 100 80 100 90 105 100 100" fill="none" stroke="#e8dfcc" stroke-width="1" opacity="0.8"/>
</g></svg>