<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8dfcc" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- Main Form (Woodcut style) -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Shadow 1 -->
  <rect x="15" y="50" width="70" height="40" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 2 -->
  <rect x="20" y="40" width="60" height="30" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 3 -->
  <rect x="25" y="30" width="50" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 4 -->
  <rect x="30" y="20" width="40" height="10" fill="#e8dfcc" stroke="none"/>
  
  <!-- Shadow 5 -->
  <rect x="35" y="10" width="30" height="5" fill="#e8dfcc" stroke="none"/>
  
  <!-- Texture Hatching -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="20" y1="80" x2="80" y2="80" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="20" y1="110" x2="80" y2="110" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="20" y1="140" x2="80" y2="140" stroke="#e8dfcc" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Keyhole Shape (Centered) -->
  <rect x="40" y="40" width="20" height="20" fill="#e8dfcc" stroke="none"/>
  
  <!-- Top Edge -->
  <line x1="40" y1="30" x2="40" y2="50" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Right Edge -->
  <line x1="40" y1="50" x2="70" y2="50" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Bottom Edge -->
  <line x1="40" y1="50" x2="40" y2="70" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Left Edge -->
  <line x1="40" y1="50" x2="20" y2="50" stroke="#e8dfcc" stroke-width="2"/>
  
  <!-- Inner Corner (Stroke only, no fill) -->
  <line x1="40" y1="40" x2="20" y2="20" stroke="#e8dfcc" stroke-width="2"/>
</g></svg>