<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <defs>
    <pattern id="hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none" stroke="#e8dfcc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main Body -->
  <rect x="20" y="20" width="60" height="60" rx="10" ry="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Roof -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Wings -->
  <rect x="20" y="45" width="40" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="50" y="45" width="40" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Cabin -->
  <rect x="35" y="60" width="30" height="30" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Door -->
  <rect x="35" y="80" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Window -->
  <rect x="35" y="100" width="30" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Roofline -->
  <rect x="35" y="35" width="20" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Roofline (lower) -->
  <rect x="35" y="55" width="20" height="10" fill="none" stroke="#e8dfcc" stroke-width="1" />
</g></svg>