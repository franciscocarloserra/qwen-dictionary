<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Main pot body -->
  <rect x="20" y="40" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <!-- Top rim -->
  <line x1="20" y1="25" x2="80" y2="25" stroke="#e8dfcc" stroke-width="1" />
  <line x1="20" y1="35" x2="80" y2="35" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Side walls -->
  <line x1="20" y1="25" x2="20" y2="80" stroke="#e8dfcc" stroke-width="1" />
  <line x1="80" y1="25" x2="80" y2="80" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Base -->
  <rect x="20" y="60" width="60" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadows (solid black blocks) -->
  <rect x="15" y="45" width="10" height="10" fill="#e8dfcc" />
  <rect x="85" y="45" width="10" height="10" fill="#e8dfcc" />
  <rect x="15" y="75" width="10" height="10" fill="#e8dfcc" />
  <rect x="85" y="75" width="10" height="10" fill="#e8dfcc" />
  
  <!-- Hatching for texture -->
  <path d="M 20 40 L 80 40" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 20 40 L 80 40" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 20 40 L 80 40" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 20 40 L 80 40" stroke="#e8dfcc" stroke-width="1" fill="none" opacity="0.6" />
</g></svg>