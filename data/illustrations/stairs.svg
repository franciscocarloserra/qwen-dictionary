<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#e8dfcc">
  <!-- Background -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Main stair structure -->
  <!-- Horizontal run -->
  <rect x="10" y="60" width="80" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Vertical risers -->
  <rect x="10" y="80" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="40" y="80" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="70" y="80" width="20" height="40" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Vertical treads -->
  <rect x="10" y="100" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="40" y="100" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="70" y="100" width="20" height="20" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Shadow area -->
  <rect x="20" y="65" width="60" height="15" fill="none" stroke="#e8dfcc" stroke-width="1" />
  <rect x="20" y="105" width="60" height="15" fill="none" stroke="#e8dfcc" stroke-width="1" />
  
  <!-- Texture hatching -->
  <path d="M 10 60 L 90 60" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 10 80 L 90 80" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 10 100 L 90 100" fill="none" stroke="#e8dfcc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
</g></svg>